version: "19.03"
services:
  app:
    build:
      context: ./
      dockerfile: app.dockerfile
    working_dir: /var/www
    volumes:
      - ./../laravel:/var/www
    environment:
      - DB_HOST=database
    depends_on:
      - database
    web:
      image: nginx:latest
      working_dir: /var/www
      volumes:
        - ./../laravel:/var/www
        - ./vhost.conf:/etc/nginx/conf.d/default.conf
      ports:
        - "8080:80"
      depends_on:
        - app
